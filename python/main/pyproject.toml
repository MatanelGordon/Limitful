[project]
name = "limitful"
version = "0.0.0"
description = "Python package scaffold for Limitful"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Matanel Gordon" },
]
requires-python = ">=3.11"
dependencies = []
keywords = ["rate-limiting", "load-leveling", "concurrency"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/MatanelGordon/Limitful"
Repository = "https://github.com/MatanelGordon/Limitful"
Issues = "https://github.com/MatanelGordon/Limitful/issues"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
# Internal workspace dependencies go here when sub-packages are added.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.9",
]
