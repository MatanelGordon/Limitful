[project]
name = "limitful-workspace"
version = "0.0.0"
requires-python = ">=3.11"
description = "Limitful — distributed rate-limiting primitives (Python monorepo)"
readme = "README.md"
license = "MIT"

[tool.uv.workspace]
members = ["main"]

[tool.uv.sources]
# No external dependencies yet — everything is local workspace members.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["main/src"]
